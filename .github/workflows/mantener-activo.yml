# Tarea automática de GitHub que "visita" la base de datos cada 3 días
# para que el plan gratis de Supabase no pause el proyecto por falta de uso.
# Lee la dirección y la clave pública desde config.js (no hay que configurar nada más).
# Debe guardarse en el repositorio con esta ruta exacta:  .github/workflows/mantener-activo.yml
name: Mantener activo Supabase

on:
  schedule:
    - cron: "17 13 */3 * *"   # cada 3 días, 8:17 a. m. hora de Lima
  workflow_dispatch:          # permite correrla a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avisar a Supabase
        run: |
          URL=$(grep -o 'SUPABASE_URL: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          KEY=$(grep -o 'SUPABASE_ANON_KEY: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "No se encontró la configuración en config.js"; exit 1; fi
          AUTH=""
          case "$KEY" in sb_*) ;; *) AUTH="Authorization: Bearer $KEY" ;; esac
          curl -sS -f -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" ${AUTH:+-H "$AUTH"} \
            -H "Content-Type: application/json" -d '{}'
          echo " -> Supabase respondió correctamente"
